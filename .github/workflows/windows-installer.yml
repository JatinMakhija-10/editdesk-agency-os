name: Windows Desktop Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & build installer
        run: |
          npm ci
          npm run dist:win

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EditDesk-Windows-Installer
          path: |
            release/*.exe
